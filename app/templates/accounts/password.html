{% extends 'base.html' %}{% block title %}修改密码{% endblock %}
{% block content %}
<section class="row">
  <div class="col-12 col-md-5 col-lg-4">
    <h1 class="h4 mb-3">修改密码</h1>
    <form method="post" class="vstack gap-3" aria-label="修改密码表单">
      {% csrf_token %}
      <div>
        <label class="form-label" for="current_password">当前密码</label>
        <input class="form-control" id="current_password" name="current_password" type="password" required autocomplete="current-password" minlength="12" maxlength="256">
      </div>
      <div>
        <label class="form-label" for="new_password">新密码</label>
        <input class="form-control" id="new_password" name="new_password" type="password" minlength="12" maxlength="256" required autocomplete="new-password">
      </div>
      <button class="btn btn-primary" type="submit">保存</button>
    </form>
  </div>
</section>
{% endblock %}
