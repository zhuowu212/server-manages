[project]
name = "server-manages"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "django>=5.2,<5.3", "djangorestframework>=3.16,<3.17",
  "gunicorn>=23,<24", "argon2-cffi>=25.1,<26", "openpyxl>=3.1.5,<3.2",
  "xlrd==2.0.2", "xlwt==1.3.0", "whitenoise>=6.11,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9", "pytest-django>=4.11,<5", "pytest-playwright>=0.7,<0.8",
  "playwright==1.56.0", "time-machine>=2.19,<3", "ruff>=0.14,<0.15",
  "mypy>=1.18,<1.19", "django-stubs>=5.2,<5.3", "types-PyYAML>=6,<7", "pyyaml>=6,<7",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
pythonpath = ["app"]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["e2e: real browser tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["app/static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "app"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["migrations", "settings_test.py"]

[tool.django-stubs]
django_settings_module = "config.settings_test"
